name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Verify compiled dist artifact
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          test -f dist/.nojekyll
          test -f dist/assets/zahidul-Illustration.webp
          test -f dist/assets/fav-icon.webp
          test -f dist/assets/p-ads.webp
          if grep -q "/src/main.tsx" dist/index.html; then
            echo "ERROR: dist/index.html still references /src/main.tsx"
            exit 1
          fi
          grep -qE "/assets/index-[A-Za-z0-9_-]+\.js" dist/index.html
          grep -qE "/assets/index-[A-Za-z0-9_-]+\.css" dist/index.html
          echo "Verified dist/index.html and static assets."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
